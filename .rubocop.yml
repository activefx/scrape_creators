# frozen_string_literal: true

plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: true
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'node_modules/**/*'
    - 'bin/*'

# Metrics
Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - '**/*_test.rb'
    - '**/*.gemspec'
    - 'Rakefile'
  AllowedMethods:
    - timeout  # Timeout.timeout blocks often wrap complex logic

Metrics/ClassLength:
  Max: 150  # Increased for API resource classes that grow with each endpoint
  Exclude:
    - 'test/**/*'
    - '**/*_test.rb'

Metrics/MethodLength:
  Max: 45  # Increased for API client methods with parameter handling and response parsing
  Exclude:
    - 'test/**/*'
    - '**/*_test.rb'

Metrics/ModuleLength:
  Exclude:
    - 'test/**/*'
    - '**/*_test.rb'

Metrics/AbcSize:
  Max: 50  # API methods often have higher ABC size due to parameter handling and response parsing
  Exclude:
    - 'test/**/*'
    - '**/*_test.rb'

Metrics/CyclomaticComplexity:
  Max: 17  # API methods with conditional parameter handling
  Exclude:
    - 'test/**/*'
    - '**/*_test.rb'

Metrics/PerceivedComplexity:
  Max: 17  # API methods with conditional parameter handling
  Exclude:
    - 'test/**/*'
    - '**/*_test.rb'

Metrics/ParameterLists:
  Max: 7  # API resource methods often wrap REST endpoints with many query parameters
  CountKeywordArgs: true

# Style
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes